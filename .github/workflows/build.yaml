name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      tag: ${{ steps.image.outputs.TAG }}
      image_name: ${{ steps.image.outputs.IMAGE_NAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Login To GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DC_PAT }}

      - name: Define Image Tag And Name
        id: image
        run: |
          TAG=$(echo $GITHUB_SHA | cut -c1-8)
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/chillofi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build And Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.IMAGE_NAME }}:${{ steps.image.outputs.TAG }}
            ${{ steps.image.outputs.IMAGE_NAME }}:latest
