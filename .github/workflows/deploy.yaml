name: Deploy

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

permissions:
  actions: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Compute Image Tag And Name
        id: vars
        run: |
          COMMIT_SHA=${{ github.event.workflow_run.head_commit.id }}
          TAG=$(echo ${COMMIT_SHA} | cut -c1-8)
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/chillofi
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /sites/chillofi.nikkeyl.com

            echo "${{ secrets.DC_PAT }}" |
              docker login ghcr.io \
                -u "${{ github.repository_owner }}" \
                --password-stdin

            IMAGE_NAME="${{ steps.vars.outputs.IMAGE_NAME }}"
            TAG="${{ steps.vars.outputs.TAG }}"
            IMAGE_TAG="${IMAGE_NAME}:${TAG}" docker compose up -d --pull always

            docker image prune -f
